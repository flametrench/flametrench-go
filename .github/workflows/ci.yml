name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against the supported Go version range. Pin to 1.22+ at
        # the spec layer (ADR 0018); a couple of older versions verify
        # that the SDK doesn't accidentally depend on bleeding-edge
        # stdlib features.
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Show env
        run: |
          go version
          go env GOMOD GOTOOLCHAIN GOWORK

      - name: Build all packages
        run: |
          for m in packages/ids packages/identity packages/tenancy packages/authz conformance; do
            (cd "$m" && go build ./...) || exit 1
          done

      - name: Test packages/ids
        working-directory: packages/ids
        run: go test -race -v ./...

      - name: Test packages/identity
        working-directory: packages/identity
        run: go test -race -v ./...

      - name: Test packages/tenancy
        working-directory: packages/tenancy
        run: go test -race -v ./...

      - name: Test packages/authz
        working-directory: packages/authz
        run: go test -race -v ./...

      - name: Test conformance suite
        working-directory: conformance
        run: go test -race -v ./...

      - name: Lint (vet)
        run: |
          for m in packages/ids packages/identity packages/tenancy packages/authz conformance; do
            (cd "$m" && go vet ./...) || exit 1
          done
